[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "papertrail-local"
version = "0.7.0"
description = "Local-first scholarly evidence index and deep-research MCP for Codex and Claude"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "PaperTrail contributors" }]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5.0"]
scale = ["sqlite-vec>=0.1.9,<0.2"]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
papertrail = "papertrail.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
papertrail = ["skill/**/*", "web/**/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
